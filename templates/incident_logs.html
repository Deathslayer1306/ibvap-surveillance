{% extends "base.html" %}

{% block title %}IBVAP — Incident Logs{% endblock %}

{% block head %}
<style>
#incident-page {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  padding: 8px;
  gap: 8px;
  overflow: hidden;
}

/* ─── Page header ─────────────────────────────────────────── */
#incident-hdr {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.vault-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--cyan);
}
.vault-sub {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 2px;
}
.vault-online {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 1px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid rgba(0,220,120,.3);
  background: rgba(0,220,120,.07);
}
.vault-online::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 2s ease-in-out infinite;
}

/* Severity filters */
.sev-filter-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid;
  transition: all var(--t-fast);
}
.sev-filter-btn.all      { color: var(--cyan);  border-color: var(--border-hi);       background: rgba(0,200,255,.06); }
.sev-filter-btn.critical { color: var(--red);   border-color: rgba(255,40,40,.4);     background: rgba(255,40,40,.06); }
.sev-filter-btn.warning  { color: var(--amber); border-color: rgba(255,170,0,.4);     background: rgba(255,170,0,.06); }
.sev-filter-btn.info     { color: var(--green); border-color: rgba(0,220,120,.4);     background: rgba(0,220,120,.06); }
.sev-filter-btn.active.all      { background: rgba(0,200,255,.2); }
.sev-filter-btn.active.critical { background: rgba(255,40,40,.2); }
.sev-filter-btn.active.warning  { background: rgba(255,170,0,.2); }
.sev-filter-btn.active.info     { background: rgba(0,220,120,.2); }

/* Date input */
.date-input {
  background: var(--bg-input);
  border: 1px solid var(--border-med);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 12px;
  font-size: 11px;
  font-family: var(--mono);
  outline: none;
  cursor: pointer;
}
.date-input:focus { border-color: var(--cyan); }
.date-input::-webkit-calendar-picker-indicator {
  filter: invert(1) brightness(.6);
  cursor: pointer;
}

/* ─── Evidence grid ───────────────────────────────────────── */
#evidence-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px;
}

#evidence-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  padding-bottom: 8px;
}

/* ─── Evidence card ───────────────────────────────────────── */
.evidence-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--t-normal);
  animation: fadein .3s ease;
  display: flex;
  flex-direction: column;
}
.evidence-card:hover {
  border-color: var(--border-hi);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

.ev-thumb {
  position: relative;
  height: 160px;
  background: #000;
  overflow: hidden;
  flex-shrink: 0;
}
.ev-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform var(--t-slow);
}
.evidence-card:hover .ev-img { transform: scale(1.03); }

.ev-no-thumb {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: linear-gradient(135deg, #060a14, #0a1428);
}

/* Overlay elements on thumbnail */
.ev-score-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  align-items: baseline;
  gap: 2px;
  padding: 3px 8px;
  border-radius: 6px;
  backdrop-filter: blur(4px);
}
.ev-breach-badge {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  text-align: center;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--red);
  background: rgba(255,0,0,.35);
  backdrop-filter: blur(4px);
  padding: 4px;
  text-transform: uppercase;
  animation: blink 1s ease-in-out infinite;
}
.ev-level-chip {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 8px !important;
}

/* Card body */
.ev-body { padding: 10px 12px; flex: 1; }
.ev-inc-id {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--cyan);
  letter-spacing: .5px;
  margin-bottom: 6px;
}
.ev-level-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.ev-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 8px;
}
.ev-meta-item { display: flex; gap: 4px; align-items: baseline; }
.ev-meta-label {
  font-size: 8px;
  color: var(--dim);
  font-family: var(--mono);
  letter-spacing: .5px;
  flex-shrink: 0;
}
.ev-meta-val { font-size: 10px; color: var(--text); }

/* ─── Count bar ───────────────────────────────────────────── */
.incident-count-bar {
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
  margin-left: auto;
}
</style>
{% endblock %}

{% block content %}
<div id="incident-page">

  <!-- Page header -->
  <div id="incident-hdr">
    <div>
      <div class="vault-title">📁 FORENSIC EVIDENCE VAULT</div>
      <div class="vault-sub">Incident Archive &amp; Snapshot Repository</div>
    </div>

    <div class="vault-online">ONLINE</div>

    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="font-size:10px;color:var(--muted);letter-spacing:1px;">SEVERITY:</span>
      <button class="sev-filter-btn all active" data-level="ALL">ALL</button>
      <button class="sev-filter-btn critical" data-level="CRITICAL">CRITICAL</button>
      <button class="sev-filter-btn warning"  data-level="WARNING">WARNING</button>
      <button class="sev-filter-btn info"     data-level="INFO">INFO</button>
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:10px;color:var(--muted);letter-spacing:1px;">DATE:</span>
      <input type="date" class="date-input" id="date-filter"/>
      <button class="btn btn-primary btn-sm" id="apply-filter-btn">APPLY</button>
    </div>

    <div class="incident-count-bar">
      <span id="incident-count">—</span> incidents
    </div>
  </div>

  <!-- Evidence grid -->
  <div id="evidence-wrap">
    <div id="evidence-grid">
      <!-- Populated by incident_logs.js -->
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/incident_logs.js"></script>
{% endblock %}
