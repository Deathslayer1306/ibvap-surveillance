{% extends "base.html" %}

{% block title %}IBVAP — Threat Feed{% endblock %}

{% block head %}
<style>
#threat-page {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  padding: 8px;
  gap: 8px;
  overflow: hidden;
}

/* ─── TOP BAR: filters + counts ──────────────────────────── */
#feed-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  flex-shrink: 0;
}

.feed-heading {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--cyan);
  margin-right: 8px;
  white-space: nowrap;
}

.level-filter-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid;
  transition: all var(--t-fast);
  white-space: nowrap;
}
.level-filter-btn.crit   { color: var(--red);   border-color: rgba(255,40,40,.4); background: rgba(255,40,40,.08); }
.level-filter-btn.warn   { color: var(--amber); border-color: rgba(255,170,0,.4); background: rgba(255,170,0,.08); }
.level-filter-btn.info   { color: var(--green); border-color: rgba(0,220,120,.4); background: rgba(0,220,120,.08); }
.level-filter-btn.active.crit   { background: rgba(255,40,40,.2); box-shadow: 0 0 8px rgba(255,40,40,.2); }
.level-filter-btn.active.warn   { background: rgba(255,170,0,.2); box-shadow: 0 0 8px rgba(255,170,0,.2); }
.level-filter-btn.active.info   { background: rgba(0,220,120,.2); box-shadow: 0 0 8px rgba(0,220,120,.2); }
.level-filter-btn .count-pill {
  font-family: var(--mono);
  padding: 0 5px;
  border-radius: 10px;
  background: rgba(0,0,0,.3);
  font-size: 9px;
}

.feed-total {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
}

/* ─── Event list ──────────────────────────────────────────── */
#feed-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

#threat-feed-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 4px;
}

/* ─── Feed event row ──────────────────────────────────────── */
.feed-event-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 7px;
  border: 1px solid transparent;
  transition: all var(--t-fast);
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
}
.feed-event-row:hover { background: var(--bg-hover); border-color: var(--border); }
.feed-event-row.new { animation: fadein .3s ease; }
.feed-event-row[data-level="CRITICAL"] { background: rgba(255,40,40,.04); }
.feed-event-row[data-level="WARNING"]  { background: rgba(255,170,0,.03); }

.fe-indicator {
  width: 3px;
  align-self: stretch;
  border-radius: 2px;
  flex-shrink: 0;
}
.feed-level-critical .fe-indicator { background: var(--red); }
.feed-level-warning  .fe-indicator { background: var(--amber); }
.feed-level-info     .fe-indicator { background: var(--green); }

.fe-icon { font-size: 16px; flex-shrink: 0; }

.fe-content { flex: 1; min-width: 0; }
.fe-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.fe-cam  { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.fe-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.fe-level { }
.fe-summary { font-size: 11px; color: var(--text); line-height: 1.4; }

.fe-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex-shrink: 0;
}
.fe-score {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}
.fe-score.score-crit { color: var(--red); }
.fe-score.score-warn { color: var(--amber); }
.fe-score.score-ok   { color: var(--green); }
.fe-ts { font-family: var(--mono); font-size: 9px; color: var(--dim); }
.fe-dt { font-family: var(--mono); font-size: 9px; color: var(--dim); }
</style>
{% endblock %}

{% block content %}
<div id="threat-page">

  <!-- Controls bar -->
  <div id="feed-controls">
    <span class="feed-heading">⚡ THREAT FEED</span>

    <button class="level-filter-btn crit active" data-level="CRITICAL">
      🔴 CRITICAL
      <span class="count-pill" id="count-critical">0</span>
    </button>
    <button class="level-filter-btn warn active" data-level="WARNING">
      🟡 WARNING
      <span class="count-pill" id="count-warning">0</span>
    </button>
    <button class="level-filter-btn info active" data-level="INFO">
      🟢 INFO
      <span class="count-pill" id="count-info">0</span>
    </button>

    <div class="search-wrap" style="margin-left:8px;">
      <input type="text" class="search-input" id="feed-search" placeholder="Search events…"/>
    </div>

    <span class="feed-total">
      <span id="feed-total-count">—</span> events
    </span>

    <button class="btn btn-ghost btn-sm" id="feed-refresh-btn" style="margin-left:auto;">
      ↺ Refresh
    </button>
  </div>

  <!-- Event list panel -->
  <div id="feed-panel" class="panel">
    <div class="panel-hdr">
      <span class="panel-title">Real-time Threat Events</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;"></div>
        <span class="panel-badge">MONITORING</span>
      </div>
    </div>
    <div id="threat-feed-list">
      <!-- Populated by threat_feed.js -->
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/threat_feed.js"></script>
{% endblock %}
